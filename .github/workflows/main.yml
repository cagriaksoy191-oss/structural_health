# CI/CD Test Timestamp: 2026-02-04T07:20
name: V12 Titanium CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Manuel tetikleme

jobs:
  build-and-test:
    runs-on: self-hosted
    timeout-minutes: 15

    env:
      # GitHub Secrets üzerinden tanımlanacak değişkenler
      OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
      PYTHONIOENCODING: utf-8

    steps:
      # 1. Kodu çek
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # 2. Python ortamını kur
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Node.js ortamını kur (Frontend için)
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4. Frontend Bağımlılıklarını Yükle ve Build Al
      - name: ⚛️ Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
        continue-on-error: true # Frontend hatası pipeline'ı durdurmasın (şimdilik)

      # 5. pip güncelle
      - name: ⬆️ Upgrade pip
        run: python -m pip install --upgrade pip

      # 4. Bağımlılıkları yükle
      - name: 📦 Install Dependencies
        run: pip install -r requirements.txt

      # 5. Health Check Testi
      - name: 🔬 Run Health Check
        run: python tests/health_check.py

      # 6. İsteğe bağlı: FastAPI syntax kontrolü
      - name: ✅ Verify Main Module
        run: python -c "import sys; sys.path.append('.'); import main; print('main.py BASARIYLA IMPORT EDILDI')"
        continue-on-error: true

      # 7. Sonuç bildirimi
      - name: 🎉 Pipeline Complete
        run: echo "✅ V12 Titanium CI/CD Pipeline başarıyla tamamlandı!"
